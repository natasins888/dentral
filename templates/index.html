<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับ - คลินิกทันตกรรม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body { background-color: #f0f7ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .hero-card { background: white; width: 100%; max-width: 500px; padding: 45px 35px; border-radius: 20px; box-shadow: 0 12px 30px rgba(2, 132, 199, 0.08); text-align: center; }
        .clinic-icon { font-size: 55px; margin-bottom: 12px; }
        h1 { color: #0f172a; font-size: 26px; margin-bottom: 10px; font-weight: 700; }
        p { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .btn-start { display: block; width: 100%; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 500; text-decoration: none; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25); }
        .admin-link { display: inline-block; margin-top: 25px; font-size: 13px; color: #94a3b8; text-decoration: none; }
        .admin-link:hover { color: #475569; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="hero-card">
        <div class="clinic-icon">🦷</div>
        <h1>คลินิกทันตกรรม</h1>
        <p>บริการตรวจสุขภาพช่องปาก อุดฟัน ถอนฟัน ขูดหินปูน และดูแลรอยยิ้มของคุณ พร้อมระบบรันคิวออนไลน์</p>
        <a href="/step1" class="btn-start">จองคิวออนไลน์ทันที &rarr;</a>
        <br>
        <a href="/admin" class="admin-link">สำหรับเจ้าหน้าที่คลินิก (Admin)</a>
    </div>
</body>
</html>
