<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้า 1 - นัดหมายจองคิว</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body { background-color: #f0f7ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 480px; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 114, 255, 0.08); margin: 20px 0; }
        .steps { display: flex; justify-content: space-between; margin-bottom: 28px; }
        .step-item { text-align: center; flex: 1; font-size: 13px; color: #a0aec0; font-weight: 500; }
        .step-item.active { color: #0284c7; font-weight: 600; }
        .step-circle { width: 32px; height: 32px; line-height: 32px; border-radius: 50%; background: #e2e8f0; color: #718096; margin: 0 auto 6px; font-size: 14px; }
        .step-item.active .step-circle { background: #0284c7; color: #fff; }
        h1 { color: #0f172a; font-size: 24px; text-align: center; margin-bottom: 8px; font-weight: 600; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .form-group { flex: 1; margin-bottom: 20px; }
        .form-row .form-group { margin-bottom: 0; }
        label { display: block; margin-bottom: 8px; color: #334155; font-weight: 500; font-size: 14px; }
        input[type="text"], input[type="date"], input[type="number"], select { width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; background-color: #f8fafc; }
        input:focus, select:focus { border-color: #0284c7; background-color: #fff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-back { flex: 1; text-align: center; text-decoration: none; background: #e2e8f0; color: #475569; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 500; line-height: 1.5; }
        .btn-submit { flex: 2; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="steps">
            <div class="step-item active"><div class="step-circle">1</div>ข้อมูลทั่วไป</div>
            <div class="step-item"><div class="step-circle">2</div>เลือกบริการ</div>
            <div class="step-item"><div class="step-circle">3</div>ยืนยันการนัด</div>
        </div>
        <h1>จองคิวทำฟัน</h1>
        <p class="subtitle">กรอกข้อมูลและเลือกวันที่สะดวก ระบบจะรันคิวให้อัตโนมัติ</p>
        <form method="POST">
            <div class="form-group">
                <label for="name">ชื่อ - นามสกุล</label>
                <input type="text" id="name" name="name" value="{{ name }}" placeholder="เช่น นายสมชาย ใจดี" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="age">อายุ (ปี)</label>
                    <input type="number" id="age" name="age" value="{{ age }}" min="1" max="120" required>
                </div>
                <div class="form-group">
                    <label for="gender">เพศ</label>
                    <select id="gender" name="gender" required>
                        <option value="">- เลือก -</option>
                        <option value="ชาย" {% if gender == 'ชาย' %}selected{% endif %}>ชาย</option>
                        <option value="หญิง" {% if gender == 'หญิง' %}selected{% endif %}>หญิง</option>
                        <option value="อื่นๆ" {% if gender == 'อื่นๆ' %}selected{% endif %}>อื่นๆ</option>
                    </select>
                </div>
            </div>

            <!-- เพิ่มช่องวันที่กลับมา -->
            <div class="form-group">
                <label for="date">วันที่ต้องการเข้ารับบริการ</label>
                <input type="date" id="date" name="date" value="{{ date }}" required>
            </div>

            <div class="btn-group">
                <a href="/" class="btn-back">&larr; ยกเลิก</a>
                <button type="submit" class="btn-submit">ถัดไป &rarr;</button>
            </div>
        </form>
    </div>
</body>
</html>
