<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการการจองคิว - สำหรับเจ้าหน้าที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body { background-color: #f1f5f9; padding: 30px 20px; color: #1e293b; }
        .container { max-width: 1050px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        h1 { font-size: 22px; color: #0f172a; font-weight: 600; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 9px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; }
        .btn-export { background: #0284c7; color: white; }
        .btn-clear { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .btn-logout { background: #e2e8f0; color: #475569; }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .badge-queue { background-color: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        .btn-del { color: #dc2626; background: #fee2e2; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-size: 13px; }
        .btn-del:hover { background: #fca5a5; }
        .empty-row { text-align: center; padding: 35px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 รายการจองคิวคนไข้</h1>
            <div class="action-buttons">
                <a href="{{ url_for('export_csv') }}" class="btn btn-export">📥 ส่งออก Excel (CSV)</a>
                <a href="{{ url_for('clear_all_bookings') }}" class="btn btn-clear" onclick="return confirm('⚠️ ยืนยันการล้างข้อมูลคิวทั้งหมดใช่หรือไม่? ไม่สามารถกู้คืนได้');">🗑️ ล้างคิวทั้งหมด</a>
                <a href="{{ url_for('admin_logout') }}" class="btn btn-logout">ออกจากระบบ</a>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>ชื่อ - นามสกุล</th>
                        <th>วันที่นัดหมาย</th>
                        <th>ลำดับคิว</th>
                        <th>บริการที่เลือก</th>
                        <th style="text-align: center;">จัดการ</th>
                    </tr>
                </thead>
                <tbody>
                    {% for b in bookings %}
                    <tr>
                        <td>{{ b.id }}</td>
                        <td><strong>{{ b.name }}</strong></td>
                        <td>{{ b.date }}</td>
                        <td><span class="badge-queue">คิวที่ {{ b.queue_number }}</span></td>
                        <td>{{ b.services }}</td>
                        <td style="text-align: center;">
                            <a href="{{ url_for('delete_booking', booking_id=b.id) }}" 
                               class="btn-del" 
                               onclick="return confirm('ต้องการลบคิวของคุณ {{ b.name }} ใช่หรือไม่?');">
                               ลบ
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" class="empty-row">ยังไม่มีรายการจองคิวในขณะนี้</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
